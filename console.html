<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Seller Support Triage Console</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --line:#30363d; --fg:#e6edf3; --dim:#8b949e;
    --accent:#58a6ff; --ok:#3fb950; --warn:#d29922; --bad:#f85149;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--mono);font-size:13px;line-height:1.55}
  .wrap{max-width:900px;margin:0 auto;padding:24px 16px 64px}
  h1{font-size:15px;margin:0 0 2px;font-weight:600}
  .sub{color:var(--dim);font-size:12px;margin-bottom:18px}
  .sub b{color:var(--fg);font-weight:600}
  textarea{width:100%;background:var(--panel);color:var(--fg);border:1px solid var(--line);
    border-radius:6px;padding:10px 12px;font:inherit;resize:vertical;min-height:64px}
  textarea:focus{outline:none;border-color:var(--accent)}
  .row{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
  button{background:var(--accent);color:#0d1117;border:0;border-radius:6px;padding:7px 14px;
    font:inherit;font-weight:600;cursor:pointer}
  button:disabled{opacity:.5;cursor:default}
  button.ghost{background:transparent;color:var(--dim);border:1px solid var(--line);font-weight:400}
  button.ghost:hover:not(:disabled){color:var(--fg);border-color:var(--dim)}
  .hint{color:var(--dim);font-size:11px;margin-top:10px}
  .out{margin-top:22px}
  .step{border-left:2px solid var(--line);padding:2px 0 2px 14px;margin-bottom:14px}
  .step .k{color:var(--dim);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
  .step .v{margin-top:3px;white-space:pre-wrap;word-break:break-word}
  .verdict{border:1px solid var(--line);border-radius:6px;padding:12px 14px;margin-bottom:16px}
  .verdict.auto{border-color:var(--ok)} .verdict.esc{border-color:var(--warn)}
  .verdict .d{font-size:15px;font-weight:700}
  .verdict.auto .d{color:var(--ok)} .verdict.esc .d{color:var(--warn)}
  .rule{margin-top:7px} .rule code{color:var(--warn)}
  .rule .why{color:var(--dim)}
  .draft{background:var(--panel);border:1px solid var(--line);border-radius:6px;
    padding:12px 14px;white-space:pre-wrap;word-break:break-word}
  a{color:var(--accent)} .dim{color:var(--dim)} .ok{color:var(--ok)} .bad{color:var(--bad)}
  .bar{height:2px;background:var(--line);overflow:hidden;border-radius:2px;margin-top:14px;display:none}
  .bar.on{display:block}
  .bar i{display:block;height:100%;width:35%;background:var(--accent);animation:sl 1.1s infinite}
  @keyframes sl{0%{transform:translateX(-100%)}100%{transform:translateX(320%)}}
</style>

<div class="wrap">
  <h1>Seller Support Triage Console</h1>
  <div class="sub">
    classify → retrieve → re-query → draft → <b>gate</b> → trail ·
    <span id="be" class="dim">checking backends…</span>
  </div>

  <textarea id="t" placeholder="Paste a seller ticket…"></textarea>
  <div class="row">
    <button id="go">Run ticket</button>
    <button class="ghost" data-x="how do I change the handling time on my listings">handling time</button>
    <button class="ghost" data-x="when will amazon transfer my money to my bank account">payout</button>
    <button class="ghost" data-x="my parcel is running late and the buyer is angry, and now amazon says my account could be deactivated if it happens again">late + deactivation</button>
    <button class="ghost" data-x="I received a trademark infringement complaint against one of my listings">trademark</button>
    <button class="ghost" data-x="my listing is suppressed and not showing in search">suppressed</button>
  </div>
  <div class="bar" id="bar"><i></i></div>
  <div class="hint" id="hint">The first request after an idle period pays a cold start (~15s). Later ones take 3–4s.</div>

  <div class="out" id="out"></div>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

fetch("health").then(r => r.json()).then(h => {
  $("#be").innerHTML = "retriever <b>" + esc(h.retriever) + "</b> · drafter <b>" +
                       esc(h.drafter) + "</b> · trail <b>" + esc(h.trail) + "</b>";
}).catch(() => $("#be").textContent = "backend unreachable");

document.querySelectorAll("button[data-x]").forEach(b =>
  b.onclick = () => { $("#t").value = b.dataset.x; run(); });
$("#go").onclick = run;
$("#t").addEventListener("keydown", e => {
  if ((e.metaKey || e.ctrlKey) && e.key === "Enter") run();
});

function step(k, v){ return '<div class="step"><div class="k">'+k+'</div><div class="v">'+v+'</div></div>'; }

// F6_ungrounded covers TWO different failures — retrieval that missed the
// confidence floor, and a draft that did not quote its passage (or invented a
// link). Cedar folds both into one rule deliberately, because "the reply is
// not grounded" is true of either. But the rule's own text describes only the
// second, so a confidence miss was being explained with a sentence about the
// draft that was demonstrably false when the draft had quoted correctly.
//
// The response already carries what tells them apart, so say which one it was.
function explain(rule, fallback, c, g){
  if(rule !== "F6_ungrounded") return fallback;

  const lowConf  = c && c.confident === false;
  const badDraft = g && g.draft_quotes_policy === false;

  if(g && g.refused)
    return "The model declined to answer rather than guess, so there is nothing grounded to send.";

  if(lowConf && badDraft)
    return "Two problems: retrieval scored " + Number(c.best_cosine).toFixed(4) +
           ", below the " + c.min_sim + " floor, and the draft did not hold up — " + (g.detail || "");

  if(lowConf)
    return "Retrieval scored " + Number(c.best_cosine).toFixed(4) + ", below the " +
           c.min_sim + " floor. The draft quoted its passage correctly — the system " +
           "is just not confident it found the right policy, so a human checks it.";

  if(badDraft)
    return "The draft did not hold up against its passage: " + (g.detail || "") +
           ". Retrieval was confident; the reply was the problem.";

  return fallback;
}

async function run(){
  const text = $("#t").value.trim();
  if(!text) return;
  $("#go").disabled = true; $("#bar").classList.add("on"); $("#out").innerHTML = "";
  const t0 = performance.now();
  try{
    const r = await fetch("ticket", {
      method:"POST", headers:{"content-type":"application/json"},
      body: JSON.stringify({text})
    });
    const b = await r.json();
    const ms = Math.round(performance.now() - t0);
    if(b.error){ $("#out").innerHTML = '<div class="bad">'+esc(b.error)+'</div><pre class="dim">'+esc(b.detail||"")+'</pre>'; return; }
    render(b, ms);
  }catch(e){
    $("#out").innerHTML = '<div class="bad">request failed: '+esc(e.message)+'</div>';
  }finally{
    $("#go").disabled = false; $("#bar").classList.remove("on");
  }
}

function render(b, ms){
  const d = b.decision, c = b.confidence, g = b.grounding || {};
  const by = s => (b.steps||[]).find(x => x.step === s) || {};
  const ret = by("retrieve"), dr = by("draft"), best = b.best || {};
  const auto = d.decision === "AUTO_SEND";

  let h = '<div class="verdict '+(auto?"auto":"esc")+'">' +
          '<div class="d">'+esc(d.decision)+'</div>';
  if(auto){
    h += '<div class="rule dim">No forbid rule matched — the reply is grounded and the category is routine.</div>';
  } else {
    (d.blocked_by||[]).forEach((r,i) => {
      h += '<div class="rule"><code>'+esc(r)+'</code><div class="why">'+
           esc(explain(r, (d.reasons||[])[i]||"", c, g))+'</div></div>';
    });
  }
  h += '</div>';

  h += step("1 · classify", esc(b.category) + ' <span class="dim">· ' + esc(by("classify").backend||"") + '</span>');

  const conf = c.confident ? '<span class="ok">above floor</span>' : '<span class="bad">below floor</span>';
  let r2 = 'cosine <b>'+Number(c.best_cosine).toFixed(4)+'</b> vs floor '+c.min_sim+' — '+conf +
           ' <span class="dim">· '+esc(ret.backend||"")+'</span>';
  if(best.title) r2 += '\n'+esc(best.title);
  if(best.heading_path) r2 += '\n<span class="dim">'+esc(best.heading_path)+'</span>';
  if(best.source_url) r2 += '\n<a href="'+esc(best.source_url)+'" target="_blank" rel="noopener">'+esc(best.source_url)+'</a>';
  h += step("2 · retrieve", r2);

  if(b.requeried) h += step("3 · re-query", '<span class="dim">the one agentic step — first attempt missed the floor, retried with policy vocabulary</span>');

  h += step("4 · draft", esc(g.detail||"") +
       ' <span class="dim">· '+esc(dr.backend||"")+(dr.fallback_reason?' · fallback: '+esc(dr.fallback_reason):"")+'</span>' +
       '<div class="draft" style="margin-top:8px">'+esc(b.draft)+'</div>');

  h += step("5 · trail", (b.steps||[]).length+' rows written · <span class="dim">ticket '+esc(b.ticket_id)+
       ' · '+ms+'ms round trip</span>');

  $("#out").innerHTML = h;
}
</script>
