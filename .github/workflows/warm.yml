# Keeps the deployed function warm with no AWS permissions at all: GitHub
# calls the public health route on a schedule. Lambda keeps an idle container
# for several minutes, so this hides the ~15 s cold start from the first
# visitor. Schedules can run a few minutes late under load; that is fine here.
#
# Turn it off by disabling the workflow in the Actions tab, or delete this file.
name: warm
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: health
        run: |
          curl --silent --show-error --max-time 60 \
            "https://vxmsr2n6ufxzgasohsc6yasdqu0mvwzx.lambda-url.us-east-1.on.aws/health"
          echo
